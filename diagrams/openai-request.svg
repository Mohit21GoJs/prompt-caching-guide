<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="360" viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="openai-request-title openai-request-desc">
        <title id="openai-request-title">Where the OpenAI breakpoint sits</title>
        <desc id="openai-request-desc">A Responses API request rendered in identity order - ordered tools, the developer handbook carrying the explicit cache breakpoint, then append-only messages - with the prompt_cache_key as routing only and cached_tokens as usage proof.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Routing arrow (drawn before boxes) -->
        <path d="M648,192 H568" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- Request container -->
        <rect x="40" y="56" width="560" height="272" rx="6" fill="#ececec" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <text x="56" y="44" fill="#5a6580" font-family="Geist Mono, ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.18em">RESPONSES API REQUEST &#183; RENDERED IDENTITY ORDER</text>

        <rect x="72" y="84" width="496" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
        <text x="88" y="104" fill="#5a6580" font-family="Geist Mono, ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.18em">1 &#183; TOOLS</text>
        <text x="88" y="122" fill="#2d3142" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600">Function schemas, ordered</text>

        <rect x="72" y="156" width="496" height="72" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="88" y="176" fill="#5a6580" font-family="Geist Mono, ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.18em">2 &#183; DEVELOPER &#183; BREAKPOINT</text>
        <text x="88" y="194" fill="#2d3142" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600">Support handbook</text>
        <text x="88" y="214" fill="#5a6580" font-family="Geist Mono, ui-monospace, monospace" font-size="9">prompt_cache_breakpoint: explicit &#183; ttl 30m</text>

        <rect x="72" y="244" width="496" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
        <text x="88" y="264" fill="#5a6580" font-family="Geist Mono, ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.18em">3 &#183; MESSAGES</text>
        <text x="88" y="282" fill="#2d3142" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600">User turns + tool outputs, append-only</text>

        <!-- Side column -->
        <rect x="648" y="156" width="272" height="72" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="664" y="176" fill="#5a6580" font-family="Geist Mono, ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.18em">ROUTING ONLY</text>
        <text x="664" y="194" fill="#2d3142" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600">prompt_cache_key</text>
        <text x="664" y="214" fill="#5a6580" font-family="Geist Mono, ui-monospace, monospace" font-size="9">the prefix still decides reuse</text>

        <rect x="648" y="244" width="272" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
        <text x="664" y="264" fill="#5a6580" font-family="Geist Mono, ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.18em">USAGE PROOF</text>
        <text x="664" y="282" fill="#2d3142" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600">cached_tokens</text>

        <text x="480" y="352" text-anchor="middle" fill="#2d3142" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="14">History only appends - earlier bytes stay reusable.</text>
      </svg>