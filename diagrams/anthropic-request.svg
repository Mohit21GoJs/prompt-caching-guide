<?xml version="1.0" encoding="UTF-8"?>
<svg width="960" height="360" viewBox="0 0 960 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="anthropic-request-title anthropic-request-desc">
        <title id="anthropic-request-title">Where Anthropic cache_control sits</title>
        <desc id="anthropic-request-desc">A Messages API request rendered in identity order - tools, system blocks carrying cache_control, then messages - with explicit placement on the stable system block versus automatic placement at the request root, and cache token usage fields as proof.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Placement arrow (drawn before boxes) -->
        <path d="M648,192 H568" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- Request container -->
        <rect x="40" y="56" width="560" height="272" rx="6" fill="#ececec" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <text x="56" y="44" fill="#5a6580" font-family="Geist Mono, ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.18em">MESSAGES API REQUEST &#183; RENDERED IDENTITY ORDER</text>

        <rect x="72" y="84" width="496" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
        <text x="88" y="104" fill="#5a6580" font-family="Geist Mono, ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.18em">1 &#183; TOOLS</text>
        <text x="88" y="122" fill="#2d3142" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600">TOOL_SCHEMAS list, ordered</text>

        <rect x="72" y="156" width="496" height="72" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="88" y="176" fill="#5a6580" font-family="Geist Mono, ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.18em">2 &#183; SYSTEM BLOCKS &#183; CACHE_CONTROL</text>
        <text x="88" y="194" fill="#2d3142" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600">Handbook + cache_control</text>
        <text x="88" y="214" fill="#5a6580" font-family="Geist Mono, ui-monospace, monospace" font-size="9">type: ephemeral &#183; ttl 5m or 1h</text>

        <rect x="72" y="244" width="496" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
        <text x="88" y="264" fill="#5a6580" font-family="Geist Mono, ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.18em">3 &#183; MESSAGES</text>
        <text x="88" y="282" fill="#2d3142" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600">User turns + tool results, append-only</text>

        <!-- Side column -->
        <rect x="648" y="156" width="272" height="72" rx="6" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1.2"/>
        <text x="664" y="176" fill="#5a6580" font-family="Geist Mono, ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.18em">PLACEMENT</text>
        <text x="664" y="194" fill="#2d3142" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600">explicit: block-level</text>
        <text x="664" y="214" fill="#5a6580" font-family="Geist Mono, ui-monospace, monospace" font-size="9">automatic: request root</text>

        <rect x="648" y="244" width="272" height="56" rx="6" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
        <text x="664" y="264" fill="#5a6580" font-family="Geist Mono, ui-monospace, monospace" font-size="8" font-weight="500" letter-spacing="0.18em">USAGE PROOF</text>
        <text x="664" y="282" fill="#2d3142" font-family="Geist, system-ui, sans-serif" font-size="12" font-weight="600">cache_read / creation tokens</text>

        <text x="480" y="352" text-anchor="middle" fill="#2d3142" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="14">Proof calls run sequentially - parallel bursts race the write.</text>
      </svg>