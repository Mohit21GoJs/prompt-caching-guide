[project]
name = "prompt-caching-guide"
version = "0.1.0"
description = "Learn prompt caching by running small marimo notebooks against Anthropic and OpenAI."
requires-python = ">=3.11"
dependencies = [
    "marimo>=0.14",
    "anthropic>=1.15.0",
    "openai>=3.35.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
