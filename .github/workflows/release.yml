name: release

# Push a tag such as v0.2.0 to publish a release whose molab links are pinned to that exact commit.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.1"
      - run: uv sync --locked --python 3.12
      - run: uv run pytest -q
      - name: Write release notes with links pinned to this commit
        run: uv run python tools/molab_links.py --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_SHA" --print > release-notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file release-notes.md
